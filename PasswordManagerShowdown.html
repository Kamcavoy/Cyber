<!DOCTYPE html>
<html lang="en" class="text-size-normal">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Manager Showdown – Cyber Security</title>
    <style>
        /* ─── ROOT FONT SIZE ─── */
        html {
            font-size: 18px;
        }
        html.text-size-small {
            font-size: 15px;
        }
        html.text-size-normal {
            font-size: 18px;
        }
        html.text-size-large {
            font-size: 22px;
        }

        /* ─── THEMES ─── */
        :root {
            --bg-body: #f0f6fc;
            --bg-card: #ffffff;
            --text-primary: #1a2634;
            --text-secondary: #2c4056;
            --text-muted: #5e768a;
            --border-light: #d0dce8;
            --border-focus: #2b6a9e;
            --shadow-card: 0 1.1rem 3.3rem rgba(0, 20, 40, 0.12);
            --bg-input: #fafcfe;
            --bg-score: #f2f8ff;
            --bg-feedback-info: #ecf5fc;
            --accent-green: #1e7a4a;
            --accent-red: #b34a3a;
            --accent-blue: #2b6a9e;
            --accent-orange: #c97a2a;
            --gradient-header: linear-gradient(145deg, #0b2b4a, #1a4a6e);
            --radius-card: 2rem;
            --bg-meter-track: #e9eef3;
            --shadow-account: 0 0.15rem 0.5rem rgba(0,0,0,0.08);
            --account-bg: #f8fafc;
        }

        [data-theme="dark"] {
            --bg-body: #121a24;
            --bg-card: #1e2a36;
            --text-primary: #e8edf2;
            --text-secondary: #c8d4e0;
            --text-muted: #8fa4b8;
            --border-light: #3a4a5a;
            --border-focus: #6a9ec8;
            --shadow-card: 0 1.1rem 3.3rem rgba(0, 0, 0, 0.5);
            --bg-input: #24303e;
            --bg-score: #1f2d3d;
            --bg-feedback-info: #1a2838;
            --accent-green: #4cc090;
            --accent-red: #e07060;
            --accent-blue: #6a9ec8;
            --accent-orange: #e8b040;
            --gradient-header: linear-gradient(145deg, #4a7a9e, #6a9ec8);
            --bg-meter-track: #3a4a5a;
            --shadow-account: 0 0.15rem 0.5rem rgba(0,0,0,0.3);
            --account-bg: #1e2a36;
        }

        /* ─── RESET ─── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.1rem;
            transition: background 0.3s, color 0.3s;
            line-height: 1.5;
        }

        .card {
            max-width: 55rem;
            width: 100%;
            background: var(--bg-card);
            border-radius: var(--radius-card);
            padding: 1.8rem 2.1rem;
            box-shadow: var(--shadow-card);
            transition: background 0.3s, box-shadow 0.3s;
            border: 1px solid var(--border-light);
        }

        /* ─── HEADER ─── */
        .app-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.7rem 1rem;
            margin-bottom: 0.3rem;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 0.7rem;
        }
        .brand .icon {
            font-size: 2rem;
            line-height: 1;
        }
        .brand h1 {
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.02rem;
            background: var(--gradient-header);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .accessibility-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .accessibility-controls button {
            background: var(--bg-input);
            border: 1px solid var(--border-light);
            border-radius: 2rem;
            padding: 0.4rem 0.8rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            line-height: 1.2;
            min-height: 2.4rem;
        }
        .accessibility-controls button:hover {
            background: var(--border-light);
        }
        .accessibility-controls .text-size-group {
            display: flex;
            gap: 0.2rem;
        }
        .accessibility-controls .text-size-group button {
            padding: 0.3rem 0.7rem;
            font-size: 0.9rem;
            min-width: 2.2rem;
            justify-content: center;
        }
        .accessibility-controls button:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
        }

        .sub {
            font-size: 0.94rem;
            color: var(--text-muted);
            margin-bottom: 1.2rem;
            line-height: 1.6;
        }
        .sub strong {
            color: var(--text-secondary);
        }

        /* ─── CONTROLS ─── */
        .control-section {
            background: var(--bg-input);
            border-radius: 1.2rem;
            padding: 1rem 1.5rem;
            border: 1px solid var(--border-light);
            margin-bottom: 1.2rem;
        }
        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem 2rem;
            align-items: center;
            margin-bottom: 0.6rem;
        }
        .control-row:last-child {
            margin-bottom: 0;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .control-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .control-group select,
        .control-group input[type="number"] {
            padding: 0.3rem 0.6rem;
            border-radius: 0.8rem;
            border: 1px solid var(--border-light);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 500;
            min-width: 4rem;
        }
        .strategy-buttons {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .strategy-buttons button {
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            border: 2px solid var(--border-light);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s, color 0.2s;
            font-size: 0.95rem;
        }
        .strategy-buttons button.active {
            border-color: var(--accent-blue);
            background: var(--accent-blue);
            color: #fff;
        }
        .strategy-buttons button:hover {
            border-color: var(--accent-blue);
        }
        .strategy-buttons button:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
        }

        /* ─── ACCOUNT GRID ─── */
        .accounts-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(4.5rem, 1fr));
            gap: 0.8rem;
            margin: 1.2rem 0;
        }
        .account-card {
            background: var(--account-bg);
            border-radius: 1rem;
            padding: 0.6rem 0.4rem;
            border: 2px solid var(--border-light);
            text-align: center;
            transition: border-color 0.3s, background 0.3s, transform 0.2s;
            box-shadow: var(--shadow-account);
            position: relative;
            min-height: 5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .account-card .id {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }
        .account-card .status {
            font-size: 1.5rem;
            line-height: 1;
        }
        .account-card .status.secure {
            color: var(--accent-green);
        }
        .account-card .status.breached {
            color: var(--accent-red);
        }
        .account-card .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.03rem;
            color: var(--text-muted);
        }
        .account-card.breached {
            border-color: var(--accent-red);
            background: #fde8e4;
        }
        [data-theme="dark"] .account-card.breached {
            background: #3a2222;
        }
        .account-card.secure {
            border-color: var(--accent-green);
        }

        /* ─── STATS ─── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr));
            gap: 0.8rem;
            margin: 1rem 0 1.2rem 0;
        }
        .stat-item {
            background: var(--bg-score);
            padding: 0.6rem 0.8rem;
            border-radius: 1rem;
            border: 1px solid var(--border-light);
            text-align: center;
        }
        .stat-item .label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03rem;
            color: var(--text-muted);
        }
        .stat-item .value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: 0.1rem;
        }
        .stat-item .value.green {
            color: var(--accent-green);
        }
        .stat-item .value.red {
            color: var(--accent-red);
        }
        .stat-item .value.orange {
            color: var(--accent-orange);
        }

        /* ─── ACTION BUTTONS ─── */
        .action-buttons {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 0.5rem 0 0.5rem 0;
        }
        .action-buttons button {
            padding: 0.6rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 3rem;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s, opacity 0.2s;
            color: #fff;
            box-shadow: 0 0.2rem 0.6rem rgba(0, 0, 0, 0.1);
            min-width: 7rem;
        }
        .action-buttons button:active:not(:disabled) {
            transform: scale(0.96);
        }
        .action-buttons button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-breach {
            background: var(--accent-red);
        }
        .btn-breach:hover:not(:disabled) {
            background: #a33a2a;
        }
        .btn-reset {
            background: var(--text-muted);
        }
        .btn-reset:hover:not(:disabled) {
            background: #4a5a6a;
        }
        .btn-simulate {
            background: var(--accent-orange);
        }
        .btn-simulate:hover:not(:disabled) {
            background: #b06a20;
        }

        /* ─── FEEDBACK ─── */
        .feedback {
            margin-top: 1rem;
            padding: 0.8rem 1.2rem;
            border-radius: 1rem;
            font-size: 0.94rem;
            line-height: 1.6;
            display: none;
            border-left: 4px solid transparent;
            background: var(--bg-feedback-info);
            color: var(--text-secondary);
        }
        .feedback.show {
            display: block;
        }
        .feedback.info {
            border-left-color: var(--accent-blue);
        }
        .feedback.success {
            border-left-color: var(--accent-green);
            color: var(--accent-green);
        }
        .feedback.danger {
            border-left-color: var(--accent-red);
            color: var(--accent-red);
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 700px) {
            .card {
                padding: 1.1rem 0.9rem;
            }
            .brand h1 {
                font-size: 1.3rem;
            }
            .control-section {
                padding: 0.8rem 1rem;
            }
            .control-row {
                flex-direction: column;
                align-items: stretch;
                gap: 0.6rem;
            }
            .accounts-container {
                grid-template-columns: repeat(auto-fill, minmax(3.5rem, 1fr));
                gap: 0.5rem;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .app-header {
                flex-direction: column;
                align-items: stretch;
            }
        }
        @media (max-width: 420px) {
            .card {
                padding: 0.8rem 0.6rem;
            }
            .accounts-container {
                grid-template-columns: repeat(auto-fill, minmax(2.8rem, 1fr));
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .action-buttons {
                flex-direction: column;
            }
            .action-buttons button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="card" id="app" role="main" aria-label="Password Manager Showdown">

        <!-- HEADER -->
        <header class="app-header">
            <div class="brand">
                <span class="icon">🔐</span>
                <h1>Password Manager Showdown</h1>
            </div>
            <div class="accessibility-controls">
	<a href="index.html" class="home-btn" style="text-decoration:none; display:inline-flex; align-items:center; gap:0.3rem; padding:0.4rem 0.8rem; border-radius:2rem; background:var(--accent-blue); color:#fff; border:1px solid var(--accent-blue); font-size:0.9rem; font-weight:500; min-height:2.4rem; transition:background 0.2s;">🏠 Home</a>
                <button id="darkModeToggle" aria-label="Toggle dark mode">
                    <span id="darkIcon">🌙</span> <span id="darkLabel">Dark</span>
                </button>
                <span class="text-size-group" role="group" aria-label="Text size controls">
                    <button id="textSmall" aria-label="Small text">A−</button>
                    <button id="textNormal" aria-label="Normal text">A</button>
                    <button id="textLarge" aria-label="Large text">A+</button>
                </span>
            </div>
        </header>

        <div class="sub">
            <strong>Compare two strategies:</strong> Reusing the same password everywhere vs. using unique, strong passwords via a manager. Run simulated breaches and see the damage.
        </div>

        <!-- CONTROLS -->
        <div class="control-section">
            <div class="control-row">
                <div class="control-group">
                    <label for="numAccounts">Accounts:</label>
                    <input type="number" id="numAccounts" value="12" min="4" max="30" step="2" style="width:4rem;" />
                </div>
                <div class="control-group">
                    <label>Strategy:</label>
                    <div class="strategy-buttons" id="strategyButtons">
                        <button data-strategy="reuse" class="active">🔄 Reuse Password</button>
                        <button data-strategy="manager">🔑 Password Manager</button>
                    </div>
                </div>
            </div>
            <div class="control-row" style="margin-top:0.4rem;">
                <div class="control-group">
                    <label>Breach attempts:</label>
                    <input type="number" id="breachAttempts" value="5" min="1" max="20" step="1" style="width:3.5rem;" />
                    <button class="btn-simulate" id="btnSimulate">⚡ Simulate Breaches</button>
                </div>
                <div class="control-group">
                    <button class="btn-reset" id="btnReset">↺ Reset Accounts</button>
                </div>
            </div>
        </div>

        <!-- ACCOUNT GRID -->
        <div class="accounts-container" id="accountsContainer">
            <!-- dynamically generated -->
        </div>

        <!-- STATS -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-item">
                <div class="label">Accounts</div>
                <div class="value" id="totalAccounts">0</div>
            </div>
            <div class="stat-item">
                <div class="label">Compromised</div>
                <div class="value red" id="compromisedCount">0</div>
            </div>
            <div class="stat-item">
                <div class="label">Secure</div>
                <div class="value green" id="secureCount">0</div>
            </div>
            <div class="stat-item">
                <div class="label">Compromise Rate</div>
                <div class="value orange" id="compromiseRate">0%</div>
            </div>
        </div>

        <!-- FEEDBACK -->
        <div class="feedback" id="feedback">
            <span id="feedbackText"></span>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ─── DOM REFS ───
            const accountsContainer = document.getElementById('accountsContainer');
            const numAccountsInput = document.getElementById('numAccounts');
            const breachAttemptsInput = document.getElementById('breachAttempts');
            const strategyButtons = document.getElementById('strategyButtons');
            const btnSimulate = document.getElementById('btnSimulate');
            const btnReset = document.getElementById('btnReset');
            const totalAccountsSpan = document.getElementById('totalAccounts');
            const compromisedCountSpan = document.getElementById('compromisedCount');
            const secureCountSpan = document.getElementById('secureCount');
            const compromiseRateSpan = document.getElementById('compromiseRate');
            const feedback = document.getElementById('feedback');
            const feedbackText = document.getElementById('feedbackText');

            // ─── STATE ───
            let accounts = [];
            let strategy = 'reuse'; // 'reuse' or 'manager'
            let breachedIndices = new Set(); // indices of breached accounts

            // ─── INIT ───
            function initAccounts(count) {
                accounts = [];
                for (let i = 0; i < count; i++) {
                    accounts.push({
                        id: i + 1,
                        breached: false,
                        // For reuse, all share the same password; we'll just mark them as breached when any is breached
                    });
                }
                breachedIndices = new Set();
                renderAccounts();
                updateStats();
                showFeedback('', '');
            }

            // ─── RENDER ───
            function renderAccounts() {
                accountsContainer.innerHTML = '';
                accounts.forEach((acc, index) => {
                    const card = document.createElement('div');
                    card.className = 'account-card';
                    if (acc.breached) {
                        card.classList.add('breached');
                    } else {
                        card.classList.add('secure');
                    }
                    card.innerHTML = `
                        <div class="id">#${acc.id}</div>
                        <div class="status ${acc.breached ? 'breached' : 'secure'}">${acc.breached ? '🔴' : '🟢'}</div>
                        <div class="label">${acc.breached ? 'Breached' : 'Secure'}</div>
                    `;
                    accountsContainer.appendChild(card);
                });
                updateStats();
            }

            function updateStats() {
                const total = accounts.length;
                const breached = accounts.filter(a => a.breached).length;
                const secure = total - breached;
                totalAccountsSpan.textContent = total;
                compromisedCountSpan.textContent = breached;
                secureCountSpan.textContent = secure;
                const rate = total > 0 ? (breached / total * 100) : 0;
                compromiseRateSpan.textContent = rate.toFixed(0) + '%';
                // color based on rate
                const rateEl = compromiseRateSpan;
                if (rate === 0) {
                    rateEl.className = 'value green';
                } else if (rate < 50) {
                    rateEl.className = 'value orange';
                } else {
                    rateEl.className = 'value red';
                }
            }

            function showFeedback(message, type) {
                if (message) {
                    feedback.className = 'feedback show ' + type;
                    feedbackText.innerHTML = message;
                } else {
                    feedback.className = 'feedback';
                    feedbackText.textContent = '';
                }
            }

            // ─── SIMULATE BREACHES ───
            function simulateBreaches(numAttempts) {
                if (accounts.length === 0) {
                    showFeedback('⚠️ Please set up accounts first.', 'danger');
                    return;
                }

                // Reset feedback
                showFeedback('');

                let breachedThisRound = 0;
                let message = '';

                for (let attempt = 0; attempt < numAttempts; attempt++) {
                    // Pick a random account
                    const idx = Math.floor(Math.random() * accounts.length);
                    const account = accounts[idx];

                    if (strategy === 'reuse') {
                        // If this account is already breached, all are breached, so nothing new.
                        if (account.breached) {
                            // Already all breached, skip
                            continue;
                        }
                        // With reuse, if we attempt to breach this account, it succeeds with high probability (90%)
                        // but we'll make it deterministic: any attempt on a non-breached account will breach it and all others.
                        // That shows the cascading effect.
                        // We'll also add a small chance (10%) that the attempt fails (to make it a bit more realistic).
                        const success = Math.random() < 0.9;
                        if (success) {
                            // Breach ALL accounts
                            accounts.forEach(a => a.breached = true);
                            breachedThisRound += accounts.length;
                            message = `💥 A breach attempt on account #${account.id} succeeded! Because you reused the same password, <strong>ALL ${accounts.length} accounts are now compromised.</strong>`;
                            break; // stop after first successful breach
                        } else {
                            // attempt failed
                            message = `🔒 Attempt on account #${account.id} failed (weak password not guessed this time).`;
                        }
                    } else { // manager strategy
                        // Each account has a unique strong password. Breach attempt succeeds with low probability (5%)
                        // to simulate other risks (e.g., phishing, malware).
                        const success = Math.random() < 0.05;
                        if (success) {
                            if (!account.breached) {
                                account.breached = true;
                                breachedThisRound++;
                                message = `⚠️ Account #${account.id} was breached despite using a password manager (simulating a phishing or malware attack).`;
                            } else {
                                message = `ℹ️ Account #${account.id} was already breached.`;
                            }
                        } else {
                            message = `🛡️ Attempt on account #${account.id} failed – strong password protected it.`;
                        }
                    }
                }

                // After simulation, render and show feedback
                renderAccounts();
                updateStats();

                // Show summary if we breached all or a lot
                const totalBreached = accounts.filter(a => a.breached).length;
                if (totalBreached === accounts.length && strategy === 'reuse') {
                    showFeedback(`💀 <strong>Total compromise!</strong> All ${accounts.length} accounts are breached because of password reuse.`, 'danger');
                } else if (totalBreached > 0) {
                    const rate = (totalBreached / accounts.length * 100).toFixed(0);
                    showFeedback(`📊 <strong>${totalBreached} accounts</strong> (${rate}%) are now compromised. ${strategy === 'manager' ? 'Password manager reduces risk, but other attacks can still occur.' : 'Reusing passwords leads to mass compromise.'}`, 'info');
                } else {
                    showFeedback(`✅ <strong>No accounts breached</strong> this round. ${strategy === 'manager' ? 'Strong unique passwords protected you!' : 'You got lucky this time, but reusing passwords is risky.'}`, 'success');
                }
            }

            // ─── RESET ───
            function resetAccounts() {
                const count = parseInt(numAccountsInput.value, 10) || 12;
                if (count < 4) numAccountsInput.value = 4;
                if (count > 30) numAccountsInput.value = 30;
                initAccounts(parseInt(numAccountsInput.value, 10));
                showFeedback('🔄 Accounts reset. Choose a strategy and simulate breaches.', 'info');
            }

            // ─── STRATEGY SWITCH ───
            function setStrategy(strat) {
                strategy = strat;
                document.querySelectorAll('.strategy-buttons button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.strategy === strat);
                });
                // Reset accounts to clear breaches when switching
                resetAccounts();
                showFeedback(`🔄 Switched to "${strat === 'reuse' ? 'Reuse Password' : 'Password Manager'}" strategy.`, 'info');
            }

            // ─── EVENT LISTENERS ───

            // Strategy buttons
            strategyButtons.addEventListener('click', function(e) {
                const btn = e.target.closest('button');
                if (!btn) return;
                const strat = btn.dataset.strategy;
                if (strat && strat !== strategy) {
                    setStrategy(strat);
                }
            });

            // Simulate breaches
            btnSimulate.addEventListener('click', function() {
                const attempts = parseInt(breachAttemptsInput.value, 10) || 5;
                if (attempts < 1) breachAttemptsInput.value = 1;
                if (attempts > 20) breachAttemptsInput.value = 20;
                simulateBreaches(parseInt(breachAttemptsInput.value, 10));
            });

            // Reset
            btnReset.addEventListener('click', resetAccounts);

            // Num accounts change: reset
            numAccountsInput.addEventListener('change', function() {
                let val = parseInt(this.value, 10);
                if (isNaN(val) || val < 4) val = 4;
                if (val > 30) val = 30;
                this.value = val;
                resetAccounts();
            });

            // ─── ACCESSIBILITY: DARK MODE ───
            const darkToggle = document.getElementById('darkModeToggle');
            const darkIcon = document.getElementById('darkIcon');
            const darkLabel = document.getElementById('darkLabel');
            let darkMode = false;
            darkToggle.addEventListener('click', function() {
                darkMode = !darkMode;
                document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
                darkIcon.textContent = darkMode ? '☀️' : '🌙';
                darkLabel.textContent = darkMode ? 'Light' : 'Dark';
                this.setAttribute('aria-label', darkMode ? 'Switch to light mode' : 'Switch to dark mode');
            });

            // ─── TEXT SIZE ───
            const htmlEl = document.documentElement;

            function setTextSize(sizeClass) {
                htmlEl.classList.remove('text-size-small', 'text-size-normal', 'text-size-large');
                htmlEl.classList.add(sizeClass);
            }
            document.getElementById('textSmall').addEventListener('click', function() { setTextSize('text-size-small'); });
            document.getElementById('textNormal').addEventListener('click', function() { setTextSize('text-size-normal'); });
            document.getElementById('textLarge').addEventListener('click', function() { setTextSize('text-size-large'); });

            // ─── INIT ───
            resetAccounts();

            console.log('🔐 Password Manager Showdown loaded!');
        })();
    </script>

</body>
</html>
